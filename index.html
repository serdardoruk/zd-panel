<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070d19">
<title>Klinik Takip Paneli</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #070d19; color: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .box {
    width: 100%; max-width: 400px; background: #0f172a; border: 1px solid #26354d;
    border-radius: 14px; padding: 24px 20px; text-align: center;
    box-shadow: 0 16px 40px rgba(0,0,0,0.45);
  }
  .spinner {
    width: 34px; height: 34px; border: 3px solid #1e293b; border-top-color: #38bdf8;
    border-radius: 50%; animation: sp 0.8s linear infinite; margin: 0 auto 14px;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
  h2 { margin: 0 0 8px; font-size: 17px; }
  p { margin: 0 0 14px; font-size: 13px; color: #94a3b8; line-height: 1.45; }
  input {
    width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid #334155;
    background: #1e293b; color: #fff; font-size: 16px; margin-bottom: 10px; text-align: center;
  }
  button {
    width: 100%; padding: 11px 14px; border-radius: 8px; border: none;
    background: #2563eb; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .err { color: #fca5a5; font-size: 12.5px; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div class="box" id="loaderBox">
  <div class="spinner" id="spin"></div>
  <h2 id="hdr">Güncel Rapor Açılıyor...</h2>
  <p id="msg">Şifreli klinik veri paketi doğrulanıyor (24.11.2026 08:32:53).</p>
  <div id="keyForm" style="display:none;">
    <input type="password" id="keyInput" placeholder="Erişim anahtarını girin" autocomplete="off">
    <button onclick="manualUnlock()">Paneli Aç</button>
  </div>
  <div class="err" id="errBox"></div>
</div>

<script>
(function() {
  function readSavedKey() {
    try { return localStorage.getItem("zd_panel_k") || ""; } catch (_) { return ""; }
  }
  function writeSavedKey(k) {
    try { localStorage.setItem("zd_panel_k", k); } catch (_) {}
  }
  function extractHashKey() {
    var h = (window.location.hash || "").replace(/^#+/, "").trim();
    if (h.startsWith("k=")) h = h.slice(2);
    return decodeURIComponent(h);
  }

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  async function decryptPacket(buf, token) {
    var bytes = new Uint8Array(buf);
    var salt = bytes.slice(0, 16);
    var iv = bytes.slice(16, 28);
    var data = bytes.slice(28);
    var baseKey = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(token), "PBKDF2", false, ["deriveKey"]
    );
    var aesKey = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    var plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, aesKey, data);
    return JSON.parse(new TextDecoder("utf-8").decode(plainBuf));
  }

  function hydrateHtml(html, blobUrls) {
    var out = html;
    Object.keys(blobUrls).forEach(function(rel) {
      var bUrl = blobUrls[rel];
      out = out.split('"' + rel + '"').join('"' + bUrl + '"');
      out = out.split("'" + rel + "'").join("'" + bUrl + "'");
    });
    return out;
  }

  function renderBundle(bundle, token) {
    var blobs = {};
    Object.keys(bundle.assets || {}).forEach(function(rel) {
      var item = bundle.assets[rel];
      var bytes = b64ToBytes(item.b64);
      blobs[rel] = URL.createObjectURL(new Blob([bytes], { type: item.mime }));
    });
    var hydrated = hydrateHtml(bundle.feedHtml, blobs);
    document.open();
    document.write(hydrated);
    document.close();
    if (token && (!window.location.hash || window.location.hash.length < 4)) {
      try { history.replaceState(null, "", window.location.pathname + window.location.search + "#" + token); } catch (_) {}
    }
    window.scrollTo(0, 0);
  }

  async function boot(token) {
    var errEl = document.getElementById("errBox");
    errEl.style.display = "none";
    if (!token) {
      document.getElementById("spin").style.display = "none";
      document.getElementById("hdr").innerText = "Erişim Anahtarı Gerekli";
      document.getElementById("msg").innerText = "Lütfen WhatsApp'tan paylaşılan tam bağlantıyı kullanın veya erişim kodunu girin.";
      document.getElementById("keyForm").style.display = "block";
      return;
    }
    try {
      document.getElementById("spin").style.display = "block";
      document.getElementById("keyForm").style.display = "none";
      var resp = await fetch("./bundle.enc?t=" + Date.now(), { cache: "no-store" });
      if (!resp.ok) throw new Error("Veri paketi indirilemedi (" + resp.status + ")");
      var lm = resp.headers.get("etag") || resp.headers.get("last-modified") || "";
      var buf = await resp.arrayBuffer();
      var bundle = await decryptPacket(buf, token);
      writeSavedKey(token);
      renderBundle(bundle, token);
      if (lm) {
        window.__ZD_VER = lm;
        var checkFresh = async function() {
          if (document.visibilityState !== "visible") return;
          try {
            var hr = await fetch("./bundle.enc?t=" + Date.now(), { method: "HEAD", cache: "no-store" });
            var nlm = hr.headers.get("etag") || hr.headers.get("last-modified") || "";
            if (nlm && window.__ZD_VER && nlm !== window.__ZD_VER) window.location.reload();
          } catch (_) {}
        };
        document.addEventListener("visibilitychange", checkFresh);
        setInterval(checkFresh, 90000);
      }
    } catch (e) {
      document.getElementById("spin").style.display = "none";
      document.getElementById("hdr").innerText = "Bağlantı Anahtarı Doğrulanamadı";
      document.getElementById("msg").innerText = "Bağlantının sonundaki #kod kısmının tam kopyalandığından emin olun.";
      document.getElementById("keyForm").style.display = "block";
      errEl.innerText = "Şifre çözme hatası veya eksik anahtar.";
      errEl.style.display = "block";
    }
  }

  window.manualUnlock = function() {
    var v = document.getElementById("keyInput").value.trim();
    if (v.includes("#")) v = v.split("#").pop();
    boot(v);
  };

  var initialKey = extractHashKey() || readSavedKey();
  boot(initialKey);
})();
</script>
</body>
</html>
