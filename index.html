<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070d19">
<title>Klinik Takip Paneli</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #070d19; color: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .box {
    width: 100%; max-width: 400px; background: #0f172a; border: 1px solid #26354d;
    border-radius: 14px; padding: 24px 20px; text-align: center;
    box-shadow: 0 16px 40px rgba(0,0,0,0.45);
  }
  .spinner {
    width: 34px; height: 34px; border: 3px solid #1e293b; border-top-color: #38bdf8;
    border-radius: 50%; animation: sp 0.8s linear infinite; margin: 0 auto 14px;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
  h2 { margin: 0 0 8px; font-size: 17px; }
  p { margin: 0 0 14px; font-size: 13px; color: #94a3b8; line-height: 1.45; }
  input {
    width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid #334155;
    background: #1e293b; color: #fff; font-size: 16px; margin-bottom: 10px; text-align: center;
  }
  button {
    width: 100%; padding: 11px 14px; border-radius: 8px; border: none;
    background: #2563eb; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .err { color: #fca5a5; font-size: 12.5px; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div class="box" id="loaderBox">
  <div class="spinner" id="spin"></div>
  <h2 id="hdr">Güncel Rapor Açılıyor...</h2>
  <p id="msg">Şifreli klinik veri paketi doğrulanıyor (25.11.2026 14:24:51).</p>
  <div id="pinForm" style="display:none;">
    <input type="password" id="pin6Input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="6 haneli şifre" autocomplete="one-time-code" style="letter-spacing:6px;font-size:20px;font-weight:700;" oninput="onPin6Input()" onkeydown="if(event.key==='Enter')submitPin6()">
    <button onclick="submitPin6()">Raporu Aç</button>
  </div>
  <div class="err" id="errBox"></div>
</div>

<script>
(function() {
  // Purge legacy v1 generic-link localStorage keys
  try {
    localStorage.removeItem("zd_panel_k");
    localStorage.removeItem("zd_utok");
    localStorage.removeItem("zd_ktag");
  } catch (_) {}

  var cachedBuf = null;
  var cachedEtag = "";
  var currentPair = { k: "", u: "" };

  function readSavedPair() {
    var k = "", u = "";
    try {
      k = localStorage.getItem("zd_panel_k2") || "";
      u = localStorage.getItem("zd_utok_v2") || "";
    } catch (_) {}
    if (!k || !u) {
      try {
        var mk = document.cookie.match(/(?:^|; *)zd_k2=([^;]+)/);
        var mu = document.cookie.match(/(?:^|; *)zd_u2=([^;]+)/);
        if (mk && !k) k = decodeURIComponent(mk[1]);
        if (mu && !u) u = decodeURIComponent(mu[1]);
      } catch (_) {}
    }
    return { k: k, u: u };
  }
  function writeSavedPair(k, u) {
    try {
      localStorage.setItem("zd_panel_k2", k);
      localStorage.setItem("zd_utok_v2", u);
    } catch (_) {}
    try {
      document.cookie = "zd_k2=" + encodeURIComponent(k) + "; max-age=31536000; path=/; SameSite=Strict; Secure";
      document.cookie = "zd_u2=" + encodeURIComponent(u) + "; max-age=31536000; path=/; SameSite=Strict; Secure";
    } catch (_) {}
  }
  function readSavedSitePin() {
    var p = "";
    try { p = (localStorage.getItem("zd_site_pin6") || "").trim(); } catch (_) {}
    if (/^[0-9]{6}$/.test(p)) return p;
    try {
      var m = document.cookie.match(/(?:^|; *)zd_site_pin6=([0-9]{6})(?:;|$)/);
      if (m) return m[1];
    } catch (_) {}
    return "";
  }
  function writeSavedSitePin(p) {
    try { localStorage.setItem("zd_site_pin6", p); } catch (_) {}
    try {
      document.cookie = "zd_site_pin6=" + p + "; max-age=31536000; path=/; SameSite=Strict; Secure";
    } catch (_) {}
  }
  function parseInputRef(raw) {
    var h = String(raw || "").replace(/^#+/, "").trim();
    if (h.includes("#")) h = h.split("#").pop().trim();
    h = decodeURIComponent(h);
    var dot = h.indexOf(".");
    if (dot > 0) {
      return { k: h.slice(0, dot), u: h.slice(dot + 1) };
    }
    return { k: h, u: "" };
  }

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }
  function b64UrlToBytes(s) {
    var b64 = s.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    return b64ToBytes(b64);
  }
  function concatBytes(arrays) {
    var total = 0;
    arrays.forEach(function(a) { total += a.length; });
    var out = new Uint8Array(total);
    var off = 0;
    arrays.forEach(function(a) { out.set(a, off); off += a.length; });
    return out;
  }

  async function verifyUserToken(uKeyB64, uTok) {
    if (!uKeyB64 || !uTok || uTok.length < 10) return false;
    try {
      var raw = b64UrlToBytes(uTok);
      if (raw.length < 8 || raw.length > 38) return false;
      var nonce = raw.slice(0, 4);
      var ct = raw.slice(4, raw.length - 3);
      var mac = raw.slice(raw.length - 3);
      var kb = b64ToBytes(uKeyB64);
      var exp = new Uint8Array(await crypto.subtle.digest("SHA-256", concatBytes([kb, new Uint8Array([2]), nonce, ct])));
      return mac[0] === exp[0] && mac[1] === exp[1] && mac[2] === exp[2];
    } catch (_) { return false; }
  }

  async function decryptPacket(buf, token) {
    var bytes = new Uint8Array(buf);
    var salt = bytes.slice(0, 16);
    var iv = bytes.slice(16, 28);
    var data = bytes.slice(28);
    var baseKey = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(token), "PBKDF2", false, ["deriveKey"]
    );
    var aesKey = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    var plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, aesKey, data);
    return JSON.parse(new TextDecoder("utf-8").decode(plainBuf));
  }

  function hydrateHtml(html, blobUrls) {
    var out = html;
    Object.keys(blobUrls).forEach(function(rel) {
      var bUrl = blobUrls[rel];
      out = out.split('"' + rel + '"').join('"' + bUrl + '"');
      out = out.split("'" + rel + "'").join("'" + bUrl + "'");
    });
    return out;
  }

  function renderBundle(bundle, token, uTok) {
    var blobs = {};
    Object.keys(bundle.assets || {}).forEach(function(rel) {
      var item = bundle.assets[rel];
      var bytes = b64ToBytes(item.b64);
      blobs[rel] = URL.createObjectURL(new Blob([bytes], { type: item.mime }));
    });
    var hydrated = hydrateHtml(bundle.feedHtml, blobs);
    document.open();
    document.write(hydrated);
    document.close();
    if (token && uTok) {
      try { history.replaceState(null, "", window.location.pathname + "#" + token + "." + uTok); } catch (_) {}
    } else if (token) {
      try { history.replaceState(null, "", window.location.pathname + "#" + token); } catch (_) {}
    }
    window.scrollTo(0, 0);
  }

  function showPinPrompt(errMsg) {
    document.getElementById("spin").style.display = "none";
    document.getElementById("hdr").innerText = "🔒 Erişim Şifresi";
    document.getElementById("msg").innerText = "Klinik takip panelini görüntülemek için 6 haneli şifreyi girin.";
    document.getElementById("pinForm").style.display = "block";
    var errEl = document.getElementById("errBox");
    if (errMsg) {
      errEl.innerText = errMsg;
      errEl.style.display = "block";
    } else {
      errEl.style.display = "none";
    }
    var inp = document.getElementById("pin6Input");
    if (inp) {
      inp.value = "";
      setTimeout(function() { inp.focus(); }, 60);
    }
  }

  async function ensureEncryptedBuffer() {
    if (cachedBuf) return cachedBuf;
    var resp = await fetch("./bundle.enc?t=" + Date.now(), { cache: "no-store" });
    if (!resp.ok) throw new Error("NETWORK_ERR");
    cachedEtag = resp.headers.get("etag") || resp.headers.get("last-modified") || "";
    cachedBuf = await resp.arrayBuffer();
    return cachedBuf;
  }

  async function tryUnlockWithPin(pin6, showErrOnFail) {
    var token = currentPair.k;
    var uTok = currentPair.u;
    try {
      document.getElementById("errBox").style.display = "none";
      document.getElementById("spin").style.display = "block";
      var buf = await ensureEncryptedBuffer();
      var bundle = await decryptPacket(buf, token + ":" + pin6);
      var okUser = await verifyUserToken(bundle.uKeyB64, uTok);
      if (!okUser) {
        try { localStorage.removeItem("zd_panel_k2"); localStorage.removeItem("zd_utok_v2"); } catch (_) {}
        document.getElementById("spin").style.display = "none";
        document.getElementById("pinForm").style.display = "none";
        document.getElementById("hdr").innerText = "Bağlantı Geçersiz";
        document.getElementById("msg").innerText = "Bu bağlantı geçerli değildir. Lütfen yetkili bağlantınızı kullanın.";
        return;
      }
      writeSavedPair(token, uTok);
      writeSavedSitePin(pin6);
      window.__ZD_UTOK = uTok;
      window.__ZD_VER = cachedEtag;
      var packetHash = await crypto.subtle.digest("SHA-256", buf);
      window.__ZD_BUNDLE_HASH = Array.from(new Uint8Array(packetHash)).map(b => b.toString(16).padStart(2, "0")).join("");
      renderBundle(bundle, token, uTok);
    } catch (e) {
      if (!cachedBuf || cachedBuf.byteLength < 4096 || (e && e.message === "NETWORK_ERR")) {
        cachedBuf = null;
        showPinPrompt("Bağlantı zayıf; lütfen sayfayı yenileyin.");
        return;
      }
      if (showErrOnFail) {
        try { localStorage.removeItem("zd_site_pin6"); } catch (_) {}
      }
      showPinPrompt(showErrOnFail ? "Hatalı 6 haneli şifre. Lütfen tekrar deneyin." : "");
    }
  }

  async function boot(pair) {
    var token = pair && pair.k ? pair.k : "";
    var uTok = pair && pair.u ? pair.u : "";
    if (!token || !uTok || token.length < 16 || uTok.length < 10) {
      document.getElementById("spin").style.display = "none";
      document.getElementById("pinForm").style.display = "none";
      document.getElementById("hdr").innerText = "Erişim Kısıtlı";
      document.getElementById("msg").innerText = "Bu sayfayı görüntülemek için kişiye özel yetkili bağlantınızı kullanın.";
      return;
    }
    currentPair = { k: token, u: uTok };
    writeSavedPair(token, uTok);
    try {
      await ensureEncryptedBuffer();
    } catch (_) {
      showPinPrompt("Veri paketi indirilemedi. Lütfen sayfayı yenileyin.");
      return;
    }
    var savedPin = readSavedSitePin();
    if (/^[0-9]{6}$/.test(savedPin)) {
      await tryUnlockWithPin(savedPin, false);
    } else {
      showPinPrompt("");
    }
  }

  window.onPin6Input = function() {
    var inp = document.getElementById("pin6Input");
    if (!inp) return;
    var clean = inp.value.replace(/[^0-9]+/g, "").slice(0, 6);
    if (inp.value !== clean) inp.value = clean;
    if (clean.length === 6) {
      tryUnlockWithPin(clean, true);
    }
  };

  window.submitPin6 = function() {
    var inp = document.getElementById("pin6Input");
    var clean = (inp ? inp.value : "").replace(/[^0-9]+/g, "");
    if (clean.length !== 6) {
      showPinPrompt("Lütfen 6 haneli sayısal şifreyi eksiksiz girin.");
      return;
    }
    tryUnlockWithPin(clean, true);
  };

  var fromHash = parseInputRef(window.location.hash);
  var saved = readSavedPair();
  var activePair = (fromHash.k && fromHash.u) ? fromHash : saved;
  boot(activePair);
})();
</script>
</body>
</html>
